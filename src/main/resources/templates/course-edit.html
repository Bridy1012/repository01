<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑课程 - 考勤管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .card-header {
            background: white;
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
        }
        .card-header h2 {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header h2 i {
            color: #667eea;
        }
        .card-body {
            padding: 30px;
        }
        .form-label {
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 10px 12px;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            outline: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
        .required-star {
            color: #ff4d4f;
            margin-left: 4px;
        }
        .hint-text {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-pencil-square"></i> 编辑课程</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/courses/edit}" th:object="${course}" method="post">
                <input type="hidden" th:field="*{courseId}">
                <div class="mb-3">
                    <label class="form-label">课程名称 <span class="required-star">*</span></label>
                    <input type="text" class="form-control" th:field="*{courseName}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">上课时间 <span class="required-star">*</span></label>
                    <input type="time" class="form-control" th:field="*{startTime}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">下课时间</label>
                    <input type="time" class="form-control" th:field="*{endTime}">
                    <div class="hint-text">可选，用于考勤时间范围校验</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">教师ID</label>
                    <input type="number" class="form-control" th:field="*{teacherId}" placeholder="关联教师账号(user_id)">
                    <div class="hint-text">可选，留空表示未指定</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">教室</label>
                    <input type="text" class="form-control" th:field="*{classroom}" placeholder="例如：A101">
                </div>
                <div class="mb-3">
                    <label class="form-label">座位布局</label>
                    <textarea class="form-control" th:field="*{seatLayout}" rows="3" placeholder="可选，描述座位安排"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">周几</label>
                    <input type="number" class="form-control" th:field="*{weekDay}" min="1" max="7" placeholder="1=周一，7=周日">
                    <div class="hint-text">输入1~7的数字</div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="/courses" class="btn btn-secondary"><i class="bi bi-x-lg"></i> 取消</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> 保存修改</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
