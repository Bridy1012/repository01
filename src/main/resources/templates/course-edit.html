<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑课程</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>编辑课程</h2>
    <form th:action="@{/courses/edit}" th:object="${course}" method="post">
        <input type="hidden" th:field="*{courseId}">
        <div class="mb-3">
            <label>课程名称</label>
            <input type="text" class="form-control" th:field="*{courseName}" required>
        </div>
        <div class="mb-3">
            <label>上课时间</label>
            <input type="time" class="form-control" th:field="*{startTime}" required>
        </div>
        <div class="mb-3">
            <label>下课时间</label>
            <input type="time" class="form-control" th:field="*{endTime}">
        </div>
        <div class="mb-3">
            <label>教室</label>
            <input type="text" class="form-control" th:field="*{classroom}">
        </div>
        <div class="mb-3">
            <label>周几（1=周一 ... 7=周日）</label>
            <input type="number" class="form-control" th:field="*{weekDay}" min="1" max="7">
        </div>
        <div class="mb-3">
            <label>座位布局</label>
            <textarea class="form-control" th:field="*{seatLayout}"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">保存修改</button>
        <a href="/courses" class="btn btn-secondary">取消</a>
    </form>
</div>
</body>
</html>
