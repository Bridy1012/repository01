<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>批量导入学生 - 考勤管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .card-header {
            background: white;
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
        }
        .card-header h2 {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-body {
            padding: 30px;
        }
        .form-label {
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 10px 12px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            outline: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
        .alert {
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 20px;
        }
        .alert-success {
            background: #e6ffed;
            color: #00b42a;
            border: 1px solid #b7eb8f;
        }
        .alert-error {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }
        .alert-info {
            background: #e6f3ff;
            color: #004085;
            border: 1px solid #b8daff;
        }
        .hint-text {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .template-link {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-file-earmark-excel"></i> 批量导入学生</h2>
        </div>
        <div class="card-body">
            <div th:if="${msg}" th:classappend="${type == 'success' ? 'alert-success' : 'alert-error'}" class="alert" th:utext="${msg}"></div>

            <div class="alert alert-info">
                <i class="bi bi-info-circle"></i> 请上传Excel文件（.xlsx格式），文件需包含以下列（顺序固定）：<br>
                <strong>学号</strong>、<strong>姓名</strong>、<strong>性别</strong>、<strong>班级</strong>、<strong>出生日期</strong>(yyyy-MM-dd)、<strong>联系方式</strong><br>
                第一行为表头，从第二行开始为数据。导入成功后，系统会自动为每个学生创建登录账号（用户名=学号，默认密码=123456）。
            </div>

            <form th:action="@{/students/import}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">选择Excel文件</label>
                    <input type="file" name="file" class="form-control" accept=".xlsx, .xls" required>
                    <div class="hint-text">仅支持.xlsx或.xls格式</div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="/students" class="btn btn-secondary"><i class="bi bi-x-lg"></i> 取消</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-upload"></i> 开始导入</button>
                </div>
            </form>

            <div class="template-link">
                <a th:href="@{/students/template}" class="btn btn-link"><i class="bi bi-download"></i> 下载Excel模板</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
