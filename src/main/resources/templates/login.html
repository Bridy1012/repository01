<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* 保持原有样式不变 */
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei",sans-serif; }
        body { min-height:100vh; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); display:flex; align-items:center; justify-content:center; padding:20px; }
        .login-card { background:white; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.15); padding:40px; width:100%; max-width:420px; }
        .login-title { text-align:center; margin-bottom:30px; color:#333; font-weight:600; }
        .input-group { position:relative; margin-bottom:20px; }
        .input-group i { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:#6c757d; font-size:18px; }
        .form-control { padding-left:45px; height:50px; border-radius:10px; border:1px solid #e0e0e0; }
        .form-control:focus { border-color:#667eea; box-shadow:0 0 0 3px rgba(102,126,234,0.2); }
        .error-alert { background:#f8d7da; color:#842029; padding:12px; border-radius:8px; margin-bottom:20px; text-align:center; }
        .login-btn { width:100%; height:50px; border-radius:10px; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); border:none; color:white; font-weight:600; transition:all 0.3s; }
        .login-btn:hover { transform:translateY(-2px); box-shadow:0 5px 15px rgba(102,126,234,0.4); }
        .link-group { text-align:center; margin-top:25px; color:#666; }
        .link-group a { color:#667eea; text-decoration:none; }
        .success-alert { background:#d4edda; color:#155724; padding:12px; border-radius:8px; margin-bottom:20px; text-align:center; }
    </style>
</head>
<body>
<div class="login-card">
    <h2 class="login-title">用户登录</h2>

    <div th:if="${msg != null}" class="success-alert" th:text="${msg}"></div>
    <div th:if="${errorMsg != null}" class="error-alert" th:text="${errorMsg}"></div>
    <div th:if="${param.error != null}" class="error-alert">用户名或密码错误</div>

    <form action="/login" method="post">
        <!-- 隐藏字段，传递 courseId -->
        <input type="hidden" name="courseId" th:value="${param.courseId}">

        <div class="input-group">
            <i class="bi bi-person-fill"></i>
            <input type="text" class="form-control" name="username" placeholder="学号" required>
        </div>
        <div class="input-group">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="form-control" name="password" placeholder="密码" required>
        </div>
        <button type="submit" class="login-btn">登 录</button>
    </form>

    <div class="link-group">
        没有账号？<a href="/register">立即注册</a>
    </div>
</div>
</body>
</html>
