<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新增学生 - 考勤管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei",sans-serif; }
        body { min-height:100vh; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); display:flex; align-items:center; justify-content:center; padding:20px; }
        .form-card { background:white; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.15); padding:40px; width:100%; max-width:500px; }
        .form-title { text-align:center; margin-bottom:30px; color:#333; font-weight:600; }
        .alert { padding:12px 20px; border-radius:8px; margin-bottom:20px; }
        .alert-success { background:#e6ffed; color:#00b42a; border:1px solid #b7eb8f; }
        .alert-error { background:#fff2f0; color:#ff4d4f; border:1px solid #ffccc7; }
        .form-group { margin-bottom:20px; }
        .form-group label { display:block; margin-bottom:8px; color:#555; font-weight:500; }
        .form-control { width:100%; height:45px; padding:0 15px; border:1px solid #ddd; border-radius:8px; }
        .form-control:focus { border-color:#667eea; outline:none; box-shadow:0 0 0 3px rgba(102,126,234,0.2); }
        .btn-submit { width:100%; height:45px; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); border:none; color:white; border-radius:8px; font-weight:600; transition:all 0.3s ease; }
        .btn-submit:hover { transform:translateY(-2px); box-shadow:0 4px 10px rgba(102,126,234,0.4); }
        .back-link { text-align:center; margin-top:20px; }
        .batch-import-card { background:#f8f9fa; border-radius:12px; padding:15px; margin-bottom:25px; border:1px solid #e9ecef; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
        .btn-batch { background:#28a745; color:white; border:none; padding:8px 20px; border-radius:8px; text-decoration:none; font-weight:500; transition:all 0.3s ease; }
        .btn-batch:hover { background:#218838; transform:translateY(-2px); color:white; }
        hr { margin:25px 0; border-color:#eee; }
    </style>
</head>
<body>
<div class="form-card">
    <h3 class="form-title">新增学生</h3>
    <div class="batch-import-card">
        <div><i class="bi bi-file-earmark-excel" style="font-size:24px; color:#28a745;"></i> <span style="font-weight:500;">批量导入学生</span>
            <p class="mt-1" style="font-size:13px;">支持Excel文件批量上传，自动创建登录账号</p></div>
        <a href="/students/import" class="btn-batch"><i class="bi bi-upload"></i> 批量导入</a>
    </div>
    <hr>
    <form th:action="@{/students/add}" method="post" th:object="${student}">
        <div class="form-group"><label>学号</label><input type="text" class="form-control" th:field="*{studentId}" required placeholder="请输入学号"></div>
        <div class="form-group"><label>姓名</label><input type="text" class="form-control" th:field="*{name}" required placeholder="请输入姓名"></div>
        <div class="form-group"><label>班级</label><input type="text" class="form-control" th:field="*{className}" required placeholder="请输入班级"></div>
        <div class="form-group"><label>性别</label><input type="text" class="form-control" th:field="*{gender}" placeholder="请输入性别"></div>
        <div class="form-group"><label>出生日期</label><input type="date" class="form-control" th:field="*{birthDate}"></div>
        <div class="form-group"><label>联系方式</label><input type="tel" class="form-control" th:field="*{phone}" placeholder="请输入手机号"></div>
        <div class="form-group"><label>考勤次数</label><input type="number" class="form-control" th:field="*{attendanceCount}" value="0" required></div>
        <button type="submit" class="btn-submit">提交</button>
    </form>
    <div class="back-link"><a th:href="@{/students}">返回学生列表</a></div>
</div>
</body>
</html>
