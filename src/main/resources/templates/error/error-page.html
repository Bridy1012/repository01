<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>提示 - 考勤管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container text-center mt-5">
    <div class="card shadow-sm" style="max-width: 500px; margin: 0 auto;">
        <div class="card-body">
            <i class="bi bi-exclamation-triangle-fill" style="font-size: 48px; color: #dc3545;"></i>
            <h4 class="mt-3">操作失败</h4>
            <p th:text="${msg}" class="text-muted"></p>
            <a href="/attendance" class="btn btn-primary">返回打卡页</a>
        </div>
    </div>
</div>
</body>
</html>
