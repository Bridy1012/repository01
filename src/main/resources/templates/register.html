<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* 样式与您原有的保持一致，此处省略重复代码 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .register-card { background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); padding: 40px; width: 100%; max-width: 420px; transition: transform 0.3s ease; }
        .register-card:hover { transform: translateY(-5px); }
        .register-title { text-align: center; margin-bottom: 30px; color: #333; font-weight: 600; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #6c757d; font-size: 18px; }
        .form-control { padding-left: 45px; height: 50px; border-radius: 10px; border: 1px solid #e0e0e0; transition: all 0.3s ease; }
        .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
        .error-alert { background-color: #f8d7da; color: #842029; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; }
        .register-btn { width: 100%; height: 50px; border-radius: 10px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; font-weight: 600; font-size: 16px; transition: all 0.3s ease; }
        .register-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .link-group { text-align: center; margin-top: 25px; color: #666; }
        .link-group a { color: #667eea; text-decoration: none; font-weight: 500; transition: color 0.3s ease; }
        .link-group a:hover { color: #764ba2; text-decoration: underline; }
    </style>
</head>
<body>
<div class="register-card">
    <h2 class="register-title">用户注册</h2>

    <div th:if="${errorMsg != null}" class="error-alert" th:text="${errorMsg}"></div>

    <form action="/register" method="post">
        <div class="input-group">
            <i class="bi bi-person-fill"></i>
            <input type="text" class="form-control" name="username" placeholder="请输入用户名（学号）" required>
        </div>
        <!-- 新增姓名输入框 -->
        <div class="input-group">
            <i class="bi bi-person-badge"></i>
            <input type="text" class="form-control" name="name" placeholder="请输入真实姓名" required>
        </div>
        <div class="input-group">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="form-control" name="password" placeholder="请输入密码" required>
        </div>
        <div class="input-group">
            <i class="bi bi-shield-lock-fill"></i>
            <input type="password" class="form-control" name="confirmPassword" placeholder="请确认密码" required>
        </div>
        <button type="submit" class="register-btn">注 册</button>
    </form>

    <div class="link-group">
        已有账号？<a href="/login">去登录</a>
    </div>
</div>
</body>
</html>
