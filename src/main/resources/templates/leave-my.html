<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的请假记录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>我的请假记录</h2>
    <a href="/leave/apply" class="btn btn-primary mb-3">+ 新请假</a>
    <a href="/attendance" class="btn btn-secondary mb-3">返回打卡页</a>
    <table class="table table-bordered">
        <thead>
        <tr><th>课程</th><th>日期范围</th><th>原因</th><th>状态</th><th>教师意见</th><th>申请时间</th></tr>
        </thead>
        <tbody>
        <tr th:each="l : ${leaves}">
            <td th:text="${l.courseName}"></td>
            <td th:text="${l.startDate} + ' 至 ' + ${l.endDate}"></td>
            <td th:text="${l.reason}"></td>
            <td>
                <span th:if="${l.status == 'pending'}" class="badge bg-warning">待审批</span>
                <span th:if="${l.status == 'approved'}" class="badge bg-success">已批准</span>
                <span th:if="${l.status == 'rejected'}" class="badge bg-danger">已拒绝</span>
            </td>
            <td th:text="${l.teacherComment}"></td>
            <td th:text="${#temporals.format(l.applyTime, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
