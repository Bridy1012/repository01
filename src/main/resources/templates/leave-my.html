<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的请假记录 - 考勤管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .card-header {
            background: white;
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .card-title {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
            color: white;
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
            color: white;
        }
        .card-body {
            padding: 30px;
            background: white;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #eee;
        }
        .table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            color: #666;
        }
        .empty-tip {
            text-align: center;
            color: #999;
            padding: 40px;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .badge-pending { background: #ffc107; color: #212529; }
        .badge-approved { background: #00b42a; color: white; }
        .badge-rejected { background: #f56c6c; color: white; }
        .alert {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .alert-success {
            background: #e6ffed;
            color: #00b42a;
            border: 1px solid #b7eb8f;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title"><i class="bi bi-journal-bookmark-fill"></i> 我的请假记录</h3>
            <div>
                <a href="/leave/apply" class="btn-primary me-2"><i class="bi bi-plus-lg"></i> 新请假</a>
                <a href="/attendance" class="btn-secondary"><i class="bi bi-arrow-left"></i> 返回打卡页</a>
            </div>
        </div>
        <div class="card-body">
            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
            <table class="table" th:if="${#lists.size(leaves) > 0}">
                <thead>
                <tr>
                    <th>课程</th>
                    <th>日期范围</th>
                    <th>原因</th>
                    <th>状态</th>
                    <th>教师意见</th>
                    <th>申请时间</th>
                </thead>
                <tbody>
                <tr th:each="l : ${leaves}">
                    <td th:text="${l.courseName}"></td>
                    <td th:text="${l.startDate} + ' 至 ' + ${l.endDate}"></td>
                    <td th:text="${l.reason}"></td>
                    <td>
                        <span th:if="${l.status == 'pending'}" class="badge badge-pending">待审批</span>
                        <span th:if="${l.status == 'approved'}" class="badge badge-approved">已批准</span>
                        <span th:if="${l.status == 'rejected'}" class="badge badge-rejected">已拒绝</span>
                    </td>
                    <td th:text="${l.teacherComment}"></td>
                    <td th:text="${#temporals.format(l.applyTime, 'yyyy-MM-dd HH:mm')}"></td>
                </tr>
                </tbody>
            </table>
            <div class="empty-tip" th:unless="${#lists.size(leaves) > 0}">
                <i class="bi bi-inbox"></i> 暂无请假记录
            </div>
        </div>
    </div>
</div>
</body>
</html>
