<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">考勤管理系统 - 首页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .dashboard-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            padding: 50px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .dashboard-card:hover {
            transform: translateY(-8px);
        }
        .system-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }
        .system-icon i {
            font-size: 40px;
            color: white;
        }
        .dashboard-title {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }
        .welcome-text {
            font-size: 20px;
            color: #667eea;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .desc-text {
            color: #666;
            font-size: 15px;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        /* 学生管理按钮样式（和主题色统一） */
        .btn-student {
            padding: 12px 30px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-student:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            color: white;
        }
        /* 返回登录按钮样式 */
        .btn-logout {
            padding: 12px 30px;
            border-radius: 10px;
            background: #e9ecef;
            border: none;
            color: #333;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-logout:hover {
            background: #dee2e6;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="dashboard-card">
    <!-- 系统图标 -->
    <div class="system-icon">
        <i class="bi bi-people-fill"></i>
    </div>

    <!-- 标题 -->
    <h2 class="dashboard-title" th:text="${title}">考勤管理系统</h2>

    <!-- 欢迎信息 -->
    <h3 class="welcome-text">恭喜你登录成功！</h3>

    <p class="desc-text">
        这里是系统管理首页，你可以进行学生管理、考勤管理等相关操作。
    </p>

    <!-- 🔥 核心修改：新增学生管理按钮，和返回登录按钮放在同一组 -->
    <div class="btn-group">
        <a href="/students" class="btn-student">
            <i class="bi bi-person-lines-fill me-1"></i> 学生管理
        </a>
        <a href="/login" class="btn-logout">
            <i class="bi bi-box-arrow-left me-1"></i> 返回登录
        </a>
    </div>
</div>
</body>
</html>
