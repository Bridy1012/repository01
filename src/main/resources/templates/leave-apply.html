<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>请假申请 - 考勤管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .card-header {
            background: white;
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
        }
        .card-header h2 {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header h2 i {
            color: #667eea;
        }
        .card-body {
            padding: 30px;
        }
        .form-label {
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 10px 12px;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            outline: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
        .alert {
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 20px;
        }
        .alert-success {
            background: #e6ffed;
            color: #00b42a;
            border: 1px solid #b7eb8f;
        }
        .alert-danger {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }
        .hint-text {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-calendar-plus"></i> 请假申请</h2>
        </div>
        <div class="card-body">
            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
            <form th:action="@{/leave/apply}" th:object="${leave}" method="post">
                <div class="mb-3">
                    <label class="form-label">学生</label>
                    <input type="text" class="form-control" th:value="${student.name} + ' (' + ${student.studentId} + ')'" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">课程名称</label>
                    <select th:field="*{courseName}" class="form-select" required>
                        <option value="">请选择课程</option>
                        <option th:each="c : ${courses}" th:value="${c.courseName}" th:text="${c.courseName}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">请假开始日期</label>
                    <input type="date" th:field="*{startDate}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">请假结束日期</label>
                    <input type="date" th:field="*{endDate}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">请假原因</label>
                    <textarea th:field="*{reason}" class="form-control" rows="4" required placeholder="请详细说明请假原因"></textarea>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="/attendance" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> 返回打卡页</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> 提交申请</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
