<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>请假申请</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>请假申请</h2>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/leave/apply}" th:object="${leave}" method="post">
                <div class="mb-3">
                    <label>学生</label>
                    <input type="text" class="form-control" th:value="${student.name} + ' (' + ${student.studentId} + ')'" readonly>
                </div>
                <div class="mb-3">
                    <label>课程名称</label>
                    <select th:field="*{courseName}" class="form-control" required>
                        <option value="">请选择课程</option>
                        <option th:each="c : ${courses}" th:value="${c.courseName}" th:text="${c.courseName}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>请假开始日期</label>
                    <input type="date" th:field="*{startDate}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>请假结束日期</label>
                    <input type="date" th:field="*{endDate}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>请假原因</label>
                    <textarea th:field="*{reason}" class="form-control" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">提交申请</button>
                <a href="/attendance" class="btn btn-secondary">返回打卡页</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
