<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>签到二维码 - 考勤管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei",sans-serif; }
        body { min-height:100vh; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); display:flex; align-items:center; justify-content:center; padding:30px; }
        .container { max-width:500px; }
        .card { background:white; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.15); overflow:hidden; }
        .card-header { background:white; padding:20px; border-bottom:1px solid #eee; text-align:center; }
        .card-header h2 { font-size:22px; font-weight:600; color:#333; display:flex; align-items:center; justify-content:center; gap:10px; }
        .card-body { padding:30px; text-align:center; }
        .qr-image { max-width:250px; margin:20px auto; border:1px solid #ddd; border-radius:16px; padding:10px; background:white; }
        .course-info { background:#f8f9fa; padding:15px; border-radius:12px; margin-bottom:20px; }
        .btn-secondary { background:#6c757d; border:none; color:white; padding:10px 24px; border-radius:8px; font-weight:500; transition:all 0.3s ease; }
        .btn-secondary:hover { background:#5a6268; transform:translateY(-2px); }
        .text-muted { font-size:14px; color:#6c757d; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-qr-code"></i> 签到二维码</h2>
        </div>
        <div class="card-body">
            <div class="course-info">
                <h5><i class="bi bi-book"></i> <span th:text="${course.courseName}"></span></h5>
                <p class="mb-0">⏰ 上课时间：<span th:text="${course.startTime}"></span> &nbsp;|&nbsp;
                    📅 周<span th:text="${course.weekDay}"></span></p>
            </div>
            <div class="qr-image">
                <img th:src="${qrBase64}" alt="签到二维码" class="img-fluid">
            </div>
            <p class="text-muted mt-3">
                <i class="bi bi-info-circle"></i> 二维码有效期5分钟<br>
                请让学生用手机扫码，自动跳转到打卡页面。
            </p>
            <a href="/courses" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> 返回课程管理</a>
        </div>
    </div>
</div>
</body>
</html>
