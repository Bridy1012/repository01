<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考勤打卡 - 考勤管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .form-card { background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); padding: 40px; width: 100%; max-width: 500px; }
        .form-title { text-align: center; margin-bottom: 30px; color: #333; font-weight: 600; }
        .alert { padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; }
        .alert-success { background: #e6ffed; color: #00b42a; border: 1px solid #b7eb8f; }
        .alert-error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
        .alert-info { background: #e6f3ff; color: #004085; border: 1px solid #b8daff; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        .form-control { width: 100%; height: 45px; padding: 0 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
        .form-control:focus { border-color: #667eea; outline: none; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
        .btn-submit { width: 100%; height: 45px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; border-radius: 8px; font-weight: 600; font-size: 16px; transition: all 0.3s ease; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(102,126,234,0.4); }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #667eea; text-decoration: none; margin: 0 8px; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="form-card">
    <h3 class="form-title">考勤打卡</h3>

    <div class="alert alert-info">
        <i class="bi bi-info-circle-fill"></i>
        <strong>打卡规则</strong><br>
        正常打卡：上课前15分钟 至 上课后30分钟<br>
        迟到打卡：上课后30分钟 至 课程结束<br>
        扫码签到自动选中课程，直接点击提交即可。
    </div>

    <div th:if="${msg}" th:classappend="${type == 'success' ? 'alert-success' : 'alert-error'}" class="alert">
        <span th:text="${msg}"></span>
    </div>

    <form th:action="@{/attendance/checkin}" method="post">
        <div class="form-group">
            <label>当前学生</label>
            <input type="text" class="form-control" th:value="${student != null ? student.name + ' (' + student.studentId + ')' : ''}" readonly>
        </div>
        <div class="form-group">
            <label>选择课程</label>
            <select name="courseId" id="courseSelect" class="form-control" required>
                <option value="">请选择课程</option>
                <option th:each="course : ${courses}" th:value="${course.courseId}" th:text="${course.courseName} + ' (' + ${course.startTime} + ')'"></option>
            </select>
        </div>
        <div class="form-group">
            <label>打卡时间（自动填充）</label>
            <input type="text" id="checkInTime" class="form-control" readonly>
        </div>
        <div class="form-group">
            <label>备注（选填）</label>
            <textarea name="remark" class="form-control" rows="3" placeholder="请输入备注信息"></textarea>
        </div>
        <button type="submit" class="btn-submit">提交打卡</button>
    </form>

    <div class="back-link">
        <a th:href="@{/leave/apply}">请假申请</a> |
        <a th:href="@{/leave/my}">我的请假记录</a>
    </div>
</div>

<script>
    window.onload = function() {
        // 自动填充当前时间
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById("checkInTime").value = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

        // 自动选中扫码带入的课程（preSelectedCourseId 由后端通过 session 传递）
        var preSelectedId = /*[[${preSelectedCourseId}]]*/ null;
        if (preSelectedId) {
            var select = document.getElementById('courseSelect');
            if (select) {
                select.value = preSelectedId;
                // 如需实现“扫码即打卡”，可取消下面注释
                // document.querySelector('form').submit();
            }
        }
    };
</script>
</body>
</html>
