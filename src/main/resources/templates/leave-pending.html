<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>请假审批 - 考勤管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .card-header {
            background: white;
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .card-title {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
            color: white;
        }
        .card-body {
            padding: 30px;
            background: white;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #eee;
        }
        .table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            color: #666;
        }
        .empty-tip {
            text-align: center;
            color: #999;
            padding: 40px;
        }
        .btn-success {
            background: #00b42a;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-success:hover {
            background: #009a24;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #f56c6c;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-danger:hover {
            background: #e04343;
            transform: translateY(-2px);
        }
        .form-control-sm {
            width: 180px;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .alert {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .alert-success {
            background: #e6ffed;
            color: #00b42a;
            border: 1px solid #b7eb8f;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title"><i class="bi bi-check2-circle"></i> 请假审批</h3>
            <a href="/students" class="btn-secondary"><i class="bi bi-arrow-left"></i> 返回学生管理</a>
        </div>
        <div class="card-body">
            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
            <table class="table" th:if="${#lists.size(leaves) > 0}">
                <thead>
                <tr>
                    <th>学号</th>
                    <th>姓名</th>
                    <th>课程</th>
                    <th>日期范围</th>
                    <th>原因</th>
                    <th>操作</th>
                </thead>
                <tbody>
                <tr th:each="l : ${leaves}">
                    <td th:text="${l.studentId}"></td>
                    <td th:text="${l.studentName}"></td>
                    <td th:text="${l.courseName}"></td>
                    <td th:text="${l.startDate} + ' 至 ' + ${l.endDate}"></td>
                    <td th:text="${l.reason}"></td>
                    <td>
                        <form th:action="@{/leave/approve}" method="post" style="display: inline-block; margin-right: 8px;">
                            <input type="hidden" name="id" th:value="${l.id}">
                            <input type="text" name="comment" placeholder="批注意见" class="form-control-sm" style="width: 140px;">
                            <button type="submit" class="btn-success"><i class="bi bi-check-lg"></i> 批准</button>
                        </form>
                        <form th:action="@{/leave/reject}" method="post" style="display: inline-block;">
                            <input type="hidden" name="id" th:value="${l.id}">
                            <input type="text" name="comment" placeholder="拒绝理由" class="form-control-sm" style="width: 140px;">
                            <button type="submit" class="btn-danger"><i class="bi bi-x-lg"></i> 拒绝</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="empty-tip" th:unless="${#lists.size(leaves) > 0}">
                <i class="bi bi-check-all"></i> 暂无待审批的请假申请
            </div>
        </div>
    </div>
</div>
</body>
</html>
