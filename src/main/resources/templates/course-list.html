<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>课程管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>课程管理</h2>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
    <a href="/courses/add" class="btn btn-primary mb-3">新增课程</a>
    <table class="table table-bordered">
        <thead>
        <tr><th>ID</th><th>课程名称</th><th>上课时间</th><th>下课时间</th><th>教师ID</th><th>教室</th><th>周几</th><th>操作</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${courses}">
            <td th:text="${c.courseId}"></td>
            <td th:text="${c.courseName}"></td>
            <td th:text="${c.startTime}"></td>
            <td th:text="${c.endTime}"></td>
            <td th:text="${c.teacherId}"></td>
            <td th:text="${c.classroom}"></td>
            <td th:text="${c.weekDay}"></td>
            <td>
                <a th:href="@{/courses/edit/{id}(id=${c.courseId})}" class="btn btn-sm btn-warning">编辑</a>
                <a th:href="@{/courses/delete/{id}(id=${c.courseId})}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除？')">删除</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/students" class="btn btn-secondary">返回学生管理</a>
</div>
</body>
</html>
