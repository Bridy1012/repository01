<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>课程管理 - 考勤管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* 样式与之前美化版本一致，此处略 */
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei",sans-serif; }
        body { min-height:100vh; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); padding:30px; }
        .container { max-width:1400px; margin:0 auto; }
        .card { border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.15); overflow:hidden; }
        .card-header { background:white; padding:20px 30px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; }
        .card-title { font-size:22px; font-weight:600; color:#333; margin:0; }
        .btn-add { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); border:none; color:white; padding:8px 20px; border-radius:8px; text-decoration:none; font-weight:500; }
        .btn-add:hover { transform:translateY(-2px); box-shadow:0 4px 10px rgba(102,126,234,0.4); color:white; }
        .btn-secondary { background:#6c757d; color:white; padding:8px 20px; border-radius:8px; text-decoration:none; }
        .btn-secondary:hover { background:#5a6268; }
        .btn-edit { background:#409eff; color:white; padding:5px 12px; border-radius:6px; text-decoration:none; font-size:14px; margin-right:5px; }
        .btn-delete { background:#f56c6c; color:white; padding:5px 12px; border-radius:6px; text-decoration:none; font-size:14px; }
        .btn-qrcode { background:#17a2b8; color:white; padding:5px 12px; border-radius:6px; text-decoration:none; font-size:14px; margin-right:5px; }
        .btn-qrcode:hover { background:#138496; }
        .table { width:100%; border-collapse:collapse; }
        .table th { background:#f8f9fa; padding:12px; text-align:left; font-weight:600; border-bottom:2px solid #eee; }
        .table td { padding:12px; border-bottom:1px solid #eee; color:#666; }
        .empty-tip { text-align:center; color:#999; padding:40px; }
        .alert { padding:12px 20px; border-radius:8px; margin-bottom:20px; }
        .alert-success { background:#e6ffed; color:#00b42a; border:1px solid #b7eb8f; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title"><i class="bi bi-book"></i> 课程管理</h3>
            <div>
                <a th:href="@{/students}" class="btn-secondary me-2"><i class="bi bi-arrow-left"></i> 返回学生管理</a>
                <a th:href="@{/courses/add}" class="btn-add"><i class="bi bi-plus-lg"></i> 新增课程</a>
            </div>
        </div>
        <div class="card-body">
            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
            <table class="table" th:if="${#lists.size(courses) > 0}">
                <thead>
                <tr>
                    <th>ID</th><th>课程名称</th><th>上课时间</th><th>下课时间</th><th>教室</th><th>周几</th><th>操作</th>
                </thead>
                <tbody>
                <tr th:each="c : ${courses}">
                    <td th:text="${c.courseId}"></td>
                    <td th:text="${c.courseName}"></td>
                    <td th:text="${c.startTime}"></td>
                    <td th:text="${c.endTime}"></td>
                    <td th:text="${c.classroom}"></td>
                    <td th:text="${c.weekDay}"></td>
                    <td>
                        <a th:href="@{/courses/edit/{id}(id=${c.courseId})}" class="btn-edit"><i class="bi bi-pencil"></i> 编辑</a>
                        <a th:href="@{/course/qrcode/{id}(id=${c.courseId})}" class="btn-qrcode"><i class="bi bi-qr-code"></i> 二维码</a>
                        <a th:href="@{/courses/delete/{id}(id=${c.courseId})}" class="btn-delete" onclick="return confirm('确定删除该课程吗？')"><i class="bi bi-trash"></i> 删除</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="empty-tip" th:unless="${#lists.size(courses) > 0}">
                <i class="bi bi-info-circle"></i> 暂无课程数据
            </div>
        </div>
    </div>
</div>
</body>
</html>
