<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生列表 - 考勤管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* 样式与之前一致，省略重复代码，可参考之前版本 */
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei",sans-serif; }
        body { min-height:100vh; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); padding:30px; }
        .container { max-width:1400px; margin:0 auto; }
        .card { border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.15); overflow:hidden; }
        .card-header { background:white; padding:20px 30px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; }
        .card-title { font-size:22px; font-weight:600; color:#333; margin:0; }
        .tool-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .search-input { width:220px; height:38px; padding:0 12px; border:1px solid #ddd; border-radius:6px; }
        .sort-select { height:38px; padding:0 8px; border:1px solid #ddd; border-radius:6px; }
        .btn { height:38px; padding:0 15px; border-radius:6px; border:none; cursor:pointer; }
        .btn-primary { background:#667eea; color:white; }
        .btn-danger { background:#f56c6c; color:white; }
        .btn-info { background:#17a2b8; color:white; }
        .btn-warning { background:#ffc107; color:#212529; }
        .btn-add { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); border:none; color:white; padding:8px 20px; border-radius:8px; text-decoration:none; font-weight:500; transition:all 0.3s ease; }
        .btn-add:hover { transform:translateY(-2px); box-shadow:0 4px 10px rgba(102,126,234,0.4); color:white; }
        .card-body { padding:30px; background:white; }
        .table { width:100%; border-collapse:collapse; }
        .table th { background:#f8f9fa; padding:12px; text-align:left; font-weight:600; color:#333; border-bottom:2px solid #eee; }
        .table td { padding:12px; border-bottom:1px solid #eee; color:#666; }
        .btn-edit { background:#409eff; color:white; padding:5px 12px; border-radius:6px; text-decoration:none; font-size:14px; margin-right:5px; }
        .btn-delete { background:#f56c6c; color:white; padding:5px 12px; border-radius:6px; text-decoration:none; font-size:14px; }
        .empty-tip { text-align:center; color:#999; padding:40px; }
        .alert { padding:12px 20px; border-radius:8px; margin-bottom:20px; }
        .alert-success { background:#e6ffed; color:#00b42a; border:1px solid #b7eb8f; }
        .alert-error { background:#fff2f0; color:#ff4d4f; border:1px solid #ffccc7; }
        .checkbox { width:18px; height:18px; cursor:pointer; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">学生列表</h3>
            <div class="tool-bar">
                <a href="/courses" class="btn btn-info">课程管理</a>
                <a href="/attendance/list" class="btn btn-info">考勤记录</a>
                <a href="/leave/pending" class="btn btn-warning">请假审批</a>
                <a href="/students/import" class="btn btn-info">批量导入</a>
                <form th:action="@{/students}" method="get" class="d-flex gap-2">
                    <input type="text" name="keyword" class="search-input" th:value="${keyword}" placeholder="学号/姓名搜索">
                    <select name="sortField" class="sort-select">
                        <option value="studentId" th:selected="${sortField=='studentId'}">按学号</option>
                        <option value="name" th:selected="${sortField=='name'}">按姓名</option>
                    </select>
                    <select name="sortDir" class="sort-select">
                        <option value="asc" th:selected="${sortDir=='asc'}">升序</option>
                        <option value="desc" th:selected="${sortDir=='desc'}">降序</option>
                    </select>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> 搜索/排序</button>
                </form>
                <form th:action="@{/students/batchDelete}" method="post" id="batchForm">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('确定删除选中的学生？')"><i class="bi bi-trash"></i> 批量删除</button>
                </form>
            </div>
            <a th:href="@{/students/add}" class="btn-add"><i class="bi bi-plus-lg"></i> 新增学生</a>
        </div>
        <div class="card-body">
            <div th:if="${msg}" th:classappend="${type == 'success' ? 'alert-success' : 'alert-error'}" class="alert">
                <span th:text="${msg}"></span>
            </div>
            <form id="studentForm">
                <table class="table" th:if="${#lists.size(students) > 0}">
                    <thead>
                    <tr>
                        <th></th>
                        <th>学号</th><th>姓名</th><th>性别</th><th>班级</th><th>出生日期</th><th>联系方式</th>
                        <th>打卡次数</th><th>迟到次数</th><th>请假次数</th><th>操作</th>
                    </thead>
                    <tbody>
                    <tr th:each="student : ${students}">
                        <td><input type="checkbox" name="studentIds" class="checkbox" th:value="${student.studentId}"></td>
                        <td th:text="${student.studentId}"></td>
                        <td th:text="${student.name}"></td>
                        <td th:text="${student.gender}"></td>
                        <td th:text="${student.className}"></td>
                        <td th:text="${student.birthDate}"></td>
                        <td th:text="${student.phone}"></td>
                        <td th:text="${checkInCountMap[student.studentId] != null ? checkInCountMap[student.studentId] : 0}"></td>
                        <td th:text="${lateCountMap[student.studentId] != null ? lateCountMap[student.studentId] : 0}"></td>
                        <td th:text="${leaveCountMap[student.studentId] != null ? leaveCountMap[student.studentId] : 0}"></td>
                        <td>
                            <a th:href="@{/students/edit/{id}(id=${student.studentId})}" class="btn-edit">编辑</a>
                            <a th:href="@{/students/delete/{id}(id=${student.studentId})}" class="btn-delete" onclick="return confirm('确定要删除吗？')">删除</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </form>
            <div class="empty-tip" th:unless="${#lists.size(students) > 0}">暂无学生数据，点击上方按钮新增学生</div>
        </div>
    </div>
</div>
<script>
    document.getElementById("batchForm").addEventListener("submit", function(e) {
        const selected = document.querySelectorAll('input[name="studentIds"]:checked');
        if(selected.length===0){ alert("请先选择要删除的学生！"); e.preventDefault(); return false; }
        const old = this.querySelectorAll('input[name="studentIds"]');
        old.forEach(i=>i.remove());
        selected.forEach(cb=>{ let h = document.createElement("input"); h.type="hidden"; h.name="studentIds"; h.value=cb.value; this.appendChild(h); });
    });
</script>
</body>
</html>
